buildscript {
    repositories {
        // FIXED: Pointing to the exact maven subdomain
        maven { url = "https://maven.fabricmc.net/" }
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        // Loom 1.10-SNAPSHOT safely resolves class files up to Java 26
        classpath "net.fabricmc:fabric-loom:1.10-SNAPSHOT"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
    }
}

apply plugin: "net.fabricmc.loom"
apply plugin: "org.jetbrains.kotlin.jvm"

// Fallback versions if none specified during matrix building
def mcVersion = project.hasProperty('targetMc') ? project.property('targetMc') : "1.21.1"
def yarnBuild = project.hasProperty('targetYarn') ? project.property('targetYarn') : "1.21.1+build.2"
def apiVersion = project.hasProperty('targetApi') ? project.property('targetApi') : "0.100.0+1.21"

version = "${mcVersion}-1.0.0"
group = 'net.topuclient'

base {
    archivesName = "topuclient-utility"
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings "net.fabricmc:yarn:${yarnBuild}:v2"
    modImplementation "net.fabricmc:fabric-loader:0.15.11"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${apiVersion}"
    modImplementation "net.fabricmc.fabric-language-kotlin:fabric-language-kotlin:1.11.0+kotlin.1.9.22"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = mcVersion.contains("26.1.2") ? 26 : 17
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions.jvmTarget = mcVersion.contains("26.1.2") ? "26" : "17"
}
